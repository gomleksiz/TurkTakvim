<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eş Uyumu · 12 Hayvanlı Türk Takvimi</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a0a00 0%, #3d1500 50%, #1a0a00 100%);
      min-height: 100vh;
      color: #f5e6c8;
    }

    header {
      text-align: center;
      padding: 2rem 1rem 1.5rem;
      background: linear-gradient(to bottom, rgba(0,0,0,0.4), transparent);
    }

    .nav-back {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: #c9a96e;
      font-size: 0.85rem;
      text-decoration: none;
      margin-bottom: 0.8rem;
      opacity: 0.8;
      transition: opacity 0.15s;
    }
    .nav-back:hover { opacity: 1; }

    header h1 {
      font-size: 2rem;
      color: #e8c36a;
      text-shadow: 0 0 20px rgba(232,195,106,0.5);
      letter-spacing: 2px;
    }

    header p { margin-top: 0.5rem; color: #c9a96e; font-size: 0.9rem; }

    .ornament {
      font-size: 1.2rem;
      color: #e8c36a;
      margin: 0.3rem 0;
      letter-spacing: 6px;
    }

    /* ── Section / Card ── */
    .section {
      max-width: 900px;
      margin: 0 auto 2rem;
      padding: 0 1rem;
    }

    .section-title {
      text-align: center;
      font-size: 0.72rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #7a6040;
      margin-bottom: 1rem;
    }

    .card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(232,195,106,0.25);
      border-radius: 16px;
      padding: 1.5rem;
    }

    /* ── Couple Forms ── */
    .couple-forms {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 0.8rem;
      align-items: start;
    }

    .partner-panel {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(232,195,106,0.2);
      border-radius: 14px;
      padding: 1.3rem;
    }

    .partner-panel.p1 { border-color: rgba(109,191,109,0.35); }
    .partner-panel.p2 { border-color: rgba(91,184,232,0.35); }

    .partner-header {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 1rem;
    }
    .p1 .partner-header { color: #6dbf6d; }
    .p2 .partner-header { color: #5bb8e8; }

    .form-divider {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem 0.3rem;
      gap: 0.4rem;
      color: #e87050;
      font-size: 1.5rem;
      opacity: 0.55;
      min-width: 2rem;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      margin-bottom: 0.75rem;
    }

    .input-group label {
      font-size: 0.8rem;
      color: #c9a96e;
    }

    .input-group input[type="text"],
    .input-group input[type="date"] {
      padding: 0.65rem 0.9rem;
      font-size: 0.95rem;
      border-radius: 10px;
      border: 1px solid rgba(232,195,106,0.35);
      background: rgba(0,0,0,0.3);
      color: #f5e6c8;
      outline: none;
      color-scheme: dark;
      width: 100%;
    }

    .input-group input:focus {
      border-color: #e8c36a;
      box-shadow: 0 0 0 2px rgba(232,195,106,0.12);
    }

    .gender-buttons { display: flex; gap: 0.4rem; }

    .gender-btn {
      flex: 1;
      padding: 0.55rem 0;
      border-radius: 8px;
      border: 1px solid rgba(232,195,106,0.2);
      background: rgba(0,0,0,0.2);
      color: #a08050;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.15s;
    }

    .gender-btn.active {
      background: rgba(232,195,106,0.14);
      border-color: #e8c36a;
      color: #e8c36a;
      font-weight: 600;
    }

    .btn-calc {
      display: block;
      width: 100%;
      padding: 0.85rem;
      background: linear-gradient(135deg, #c8860a, #e8c36a);
      color: #1a0a00;
      font-weight: 700;
      font-size: 1rem;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      margin-top: 1.2rem;
    }

    .btn-calc:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(232,195,106,0.4);
    }

    /* ── Compat Score ── */
    .compat-score-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(232,195,106,0.25);
      border-radius: 14px;
      padding: 1.4rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    .score-circle {
      width: 80px; height: 80px;
      border-radius: 50%;
      border: 3px solid #e8c36a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: rgba(0,0,0,0.3);
    }

    .score-number {
      font-size: 1.6rem;
      font-weight: 700;
      color: #e8c36a;
      line-height: 1;
    }

    .score-max { font-size: 0.6rem; color: #7a6040; }

    .score-info { flex: 1; }
    .score-label { font-size: 1.1rem; font-weight: 700; color: #f5e6c8; }
    .score-desc  { font-size: 0.8rem; color: #9a7850; margin-top: 0.3rem; line-height: 1.5; }

    .score-bar-wrap { width: 100%; background: rgba(0,0,0,0.3); border-radius: 4px; height: 6px; margin-top: 0.6rem; }
    .score-bar { height: 6px; border-radius: 4px; transition: width 0.5s; }

    /* ── Birth Cards Side by Side ── */
    .couple-birth-grid {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 0.8rem;
      align-items: start;
    }

    .partner-birth-card {
      background: rgba(0,0,0,0.25);
      border: 1px solid rgba(232,195,106,0.15);
      border-radius: 12px;
      padding: 1rem;
    }

    .pbc-header {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      margin-bottom: 0.8rem;
    }

    .pbc-icon { font-size: 2rem; }

    .pbc-name { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; }
    .p1 .pbc-name { color: #6dbf6d; }
    .p2 .pbc-name { color: #5bb8e8; }

    .pbc-animal { font-size: 1rem; font-weight: 700; color: #f5e6c8; }
    .pbc-elem   { font-size: 0.78rem; font-weight: 600; margin-top: 0.1rem; }

    .pillars-mini {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.4rem;
    }

    .pm-card {
      background: rgba(0,0,0,0.2);
      border: 1px solid rgba(232,195,106,0.1);
      border-radius: 8px;
      padding: 0.45rem 0.3rem;
      text-align: center;
    }

    .pm-label    { font-size: 0.5rem; text-transform: uppercase; letter-spacing: 1px; color: #5a4020; margin-bottom: 0.15rem; }
    .pm-icon     { font-size: 1.2rem; line-height: 1.2; }
    .pm-animal   { font-size: 0.68rem; font-weight: 700; color: #f5e6c8; margin-top: 0.1rem; }
    .pm-elem     { font-size: 0.6rem; font-weight: 600; margin-top: 0.05rem; }
    .pm-gift     { font-size: 0.52rem; color: #d4a657; margin-top: 0.1rem; line-height: 1.3; }

    /* ── Cross Interaction Matrix ── */
    .cx-matrix {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      justify-content: center;
      align-items: stretch;
      min-width: 140px;
    }

    .cx-title {
      font-size: 0.55rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #5a4020;
      text-align: center;
      margin-bottom: 0.3rem;
    }

    .cx-row {
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }

    .cx-label-a { font-size: 0.58rem; color: #6dbf6d; width: 40px; text-align: right; flex-shrink: 0; }
    .cx-label-b { font-size: 0.58rem; color: #5bb8e8; width: 40px; text-align: left; flex-shrink: 0; }

    .cx-badge {
      flex: 1;
      text-align: center;
      font-size: 0.62rem;
      font-weight: 700;
      padding: 2px 4px;
      border-radius: 8px;
    }

    .cx-badge.trine   { background: rgba(109,191,109,0.18); color: #6dbf6d; border: 1px solid rgba(109,191,109,0.4); }
    .cx-badge.secret  { background: rgba(91,184,232,0.15);  color: #5bb8e8; border: 1px solid rgba(91,184,232,0.3); }
    .cx-badge.clash   { background: rgba(232,112,80,0.18);  color: #e87050; border: 1px solid rgba(232,112,80,0.4); }
    .cx-badge.neutral { background: rgba(122,96,64,0.12);   color: #7a6040; border: 1px solid rgba(122,96,64,0.2); }
    .cx-badge.same    { background: rgba(232,195,106,0.12); color: #e8c36a; border: 1px solid rgba(232,195,106,0.3); }

    /* ── Phase Sync ── */
    .phase-sync-list {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .ps-item {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      padding: 0.55rem 0.8rem;
      border-radius: 8px;
      background: rgba(109,191,109,0.07);
      border: 1px solid rgba(109,191,109,0.2);
    }

    .ps-icon  { font-size: 1.1rem; }
    .ps-years { font-size: 0.82rem; font-weight: 700; color: #e8c36a; min-width: 80px; }
    .ps-phase { font-size: 0.78rem; color: #c9a96e; }
    .ps-ages  { font-size: 0.68rem; color: #7a6040; margin-top: 0.1rem; }

    /* ── Dual Timeline ── */
    .dt-header {
      display: grid;
      grid-template-columns: 1fr 60px 1fr;
      gap: 0;
      margin-bottom: 0.5rem;
      padding: 0 0.5rem;
    }

    .dt-header-left  { font-size: 0.75rem; font-weight: 700; color: #6dbf6d; text-align: right; padding-right: 0.8rem; }
    .dt-header-mid   { text-align: center; font-size: 0.6rem; color: #5a4020; }
    .dt-header-right { font-size: 0.75rem; font-weight: 700; color: #5bb8e8; text-align: left; padding-left: 0.8rem; }

    .dt-body {
      position: relative;
    }

    .dt-vline {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 3px;
      top: 0; bottom: 0;
      background: linear-gradient(to bottom, #6dbf6d 0%, #5bb8e8 40%, #e87050 80%, #e8c36a 100%);
      border-radius: 2px;
      z-index: 0;
    }

    .dt-row {
      display: grid;
      grid-template-columns: 1fr 60px 1fr;
      align-items: center;
      gap: 0;
      position: relative;
      z-index: 1;
    }

    .dt-left  { padding-right: 0.6rem; display: flex; justify-content: flex-end; }
    .dt-right { padding-left:  0.6rem; display: flex; justify-content: flex-start; }

    .dt-mid {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .dt-dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      background: #e8c36a;
      border: 2px solid rgba(0,0,0,0.5);
      z-index: 2;
      flex-shrink: 0;
    }

    .dt-dot.both  { background: #e87050; width: 14px; height: 14px; box-shadow: 0 0 6px rgba(232,112,80,0.5); }
    .dt-dot.p1only  { background: #6dbf6d; }
    .dt-dot.p2only  { background: #5bb8e8; }

    .dt-year {
      font-size: 0.6rem;
      color: #7a6040;
      font-weight: 600;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .dt-event {
      padding: 0.45rem 0.6rem;
      border-radius: 8px;
      background: rgba(0,0,0,0.25);
      border: 1px solid rgba(232,195,106,0.12);
      max-width: 200px;
      font-size: 0.72rem;
    }

    .dt-event.p1 { border-left: 3px solid #6dbf6d; text-align: right; }
    .dt-event.p2 { border-left: 3px solid #5bb8e8; text-align: left; }
    .dt-event.norolojik  { border-left-color: #5bb8e8; }
    .dt-event.kozmolojik { border-left-color: #e87050; }
    .dt-event.kesisim    { border-left-color: #e8c36a; }

    .de-age   { font-size: 0.62rem; color: #7a6040; }
    .de-title { font-size: 0.72rem; font-weight: 600; color: #f5e6c8; margin-top: 0.1rem; }
    .de-anim  { font-size: 0.62rem; color: #c9a96e; margin-top: 0.05rem; }

    .dt-spacer {
      height: 0;
    }

    /* ── AI ── */
    .btn-ai {
      width: 100%;
      padding: 0.75rem;
      background: linear-gradient(135deg, rgba(109,191,109,0.15), rgba(91,184,232,0.1));
      border: 1px solid rgba(109,191,109,0.35);
      border-radius: 10px;
      color: #e8c36a;
      font-size: 0.92rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-top: 0.6rem;
    }

    .btn-ai:hover    { opacity: 0.85; }
    .btn-ai:disabled { opacity: 0.5; cursor: not-allowed; }

    .ai-result { display: none; flex-direction: column; gap: 0.7rem; margin-top: 0.8rem; }
    .ai-result.visible { display: flex; }

    .ai-block {
      background: rgba(0,0,0,0.22);
      border: 1px solid rgba(232,195,106,0.15);
      border-radius: 10px;
      padding: 0.8rem 1rem;
    }

    .ai-block-title { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 2px; color: #7a6040; margin-bottom: 0.4rem; }
    .ai-block-text  { font-size: 0.85rem; color: #c9a96e; line-height: 1.65; }

    .oa-list { display: flex; flex-direction: column; gap: 0.45rem; margin-top: 0.5rem; }

    .oa-item {
      display: flex;
      align-items: flex-start;
      gap: 0.6rem;
      padding: 0.6rem 0.8rem;
      border-radius: 9px;
      border: 1px solid rgba(232,195,106,0.1);
      background: rgba(0,0,0,0.18);
    }

    .oa-item.uyum     { border-left: 3px solid #6dbf6d; }
    .oa-item.dikkat   { border-left: 3px solid #e87050; }
    .oa-item.donusum  { border-left: 3px solid #e8c36a; }

    .oa-icon    { font-size: 1.1rem; flex-shrink: 0; }
    .oa-yil     { font-size: 0.78rem; font-weight: 700; color: #e8c36a; }
    .oa-baslik  { font-size: 0.82rem; font-weight: 700; color: #f5e6c8; }
    .oa-aciklama{ font-size: 0.77rem; color: #a08050; line-height: 1.55; margin-top: 0.15rem; }

    /* ── Responsive ── */
    @media (max-width: 620px) {
      .couple-forms { grid-template-columns: 1fr; }
      .form-divider  { flex-direction: row; padding: 0.4rem 0; }
      .couple-birth-grid { grid-template-columns: 1fr; }
      .cx-matrix { min-width: unset; }
      .dt-header, .dt-row { grid-template-columns: 1fr 44px 1fr; }
    }

    .empty-state {
      text-align: center;
      color: #5a4020;
      font-size: 0.85rem;
      padding: 2rem;
    }

    #coupleResult { display: none; }
    #coupleResult.visible { display: block; }
  </style>
</head>
<body>

<header>
  <a class="nav-back" href="index.html">← Ana Sayfa</a>
  <div class="ornament">♥ ♥ ♥</div>
  <h1>Eş Uyumu</h1>
  <p>İki kişinin doğum haritası ve zaman yolculuğu</p>
  <div class="ornament">♥ ♥ ♥</div>
</header>

<!-- Forms -->
<div class="section" style="margin-top:1.5rem">
  <div class="couple-forms">

    <!-- Partner 1 -->
    <div class="partner-panel p1">
      <div class="partner-header">💚 Birinci Kişi</div>
      <div class="input-group">
        <label>İsim (isteğe bağlı)</label>
        <input type="text" id="name1" placeholder="Adı">
      </div>
      <div class="input-group">
        <label>Doğum Tarihi</label>
        <input type="date" id="date1">
      </div>
      <div class="input-group">
        <label>Cinsiyet</label>
        <div class="gender-buttons">
          <button class="gender-btn active" id="g1F" onclick="setGender(1,'female')">♀ Kadın</button>
          <button class="gender-btn" id="g1M" onclick="setGender(1,'male')">♂ Erkek</button>
        </div>
      </div>
    </div>

    <!-- Divider -->
    <div class="form-divider">♥<br>♥<br>♥</div>

    <!-- Partner 2 -->
    <div class="partner-panel p2">
      <div class="partner-header">💙 İkinci Kişi</div>
      <div class="input-group">
        <label>İsim (isteğe bağlı)</label>
        <input type="text" id="name2" placeholder="Adı">
      </div>
      <div class="input-group">
        <label>Doğum Tarihi</label>
        <input type="date" id="date2">
      </div>
      <div class="input-group">
        <label>Cinsiyet</label>
        <div class="gender-buttons">
          <button class="gender-btn active" id="g2F" onclick="setGender(2,'female')">♀ Kadın</button>
          <button class="gender-btn" id="g2M" onclick="setGender(2,'male')">♂ Erkek</button>
        </div>
      </div>
    </div>

  </div>

  <button class="btn-calc" onclick="calcCouple()">✦ Uyumu Hesapla</button>
</div>

<!-- Results -->
<div id="coupleResult">

  <!-- Uyum Skoru -->
  <div class="section">
    <div class="section-title">— Doğum Uyumu —</div>
    <div class="compat-score-card" id="compatScoreCard"></div>
  </div>

  <!-- İki Doğum Kartı + Çapraz Matris -->
  <div class="section">
    <div class="section-title">— Sütun Karşılaştırması —</div>
    <div class="couple-birth-grid" id="couplebirthGrid"></div>
  </div>

  <!-- Evre Uyumu -->
  <div class="section" id="phaseSyncSection">
    <div class="section-title">— Aynı Yaşam Evresinde Olduğunuz Dönemler —</div>
    <div class="card">
      <div class="phase-sync-list" id="phaseSyncList"></div>
    </div>
  </div>

  <!-- İkili Hayat Çizgisi -->
  <div class="section">
    <div class="section-title">— İkili Hayat Çizgisi —</div>
    <div class="card" style="padding:1.2rem 1rem">
      <div class="dt-header" id="dtHeader"></div>
      <div class="dt-body" id="dtBody">
        <div class="dt-vline"></div>
      </div>
    </div>
  </div>

  <!-- AI -->
  <div class="section">
    <div class="card">
      <button class="btn-ai" id="btnAI" onclick="requestAI()">🔮 Kişiselleştirilmiş Uyum Yorumu Al</button>
      <div class="ai-result" id="aiResult"></div>
    </div>
  </div>

</div>

<footer style="text-align:center;padding:2rem 1rem;font-size:0.75rem;color:#5a4020">
  12 Hayvanlı Türk Takvimi · Eş Uyumu
</footer>

<script>
// ─────────────────────────────────────────────
// VERI SABİTLERİ
// ─────────────────────────────────────────────

const ANIMALS = [
  { name:'Maymun',  altName:'Biçin',    icon:'🐒',  idx:0  },
  { name:'Horoz',   altName:'Takagu',   icon:'🐓',  idx:1  },
  { name:'Köpek',   altName:'İt',       icon:'🐕',  idx:2  },
  { name:'Domuz',   altName:'Tonguz',   icon:'🐗',  idx:3  },
  { name:'Sıçan',   altName:'Çichqan',  icon:'🐀',  idx:4  },
  { name:'Öküz',    altName:'Ud',       icon:'🐂',  idx:5  },
  { name:'Kaplan',  altName:'Bars',     icon:'🐯',  idx:6  },
  { name:'Tavşan',  altName:'Tavışkan', icon:'🐇',  idx:7  },
  { name:'Ejderha', altName:'Lu',       icon:'🐉',  idx:8  },
  { name:'Yılan',   altName:'Çılan',    icon:'🐍',  idx:9  },
  { name:'At',      altName:'Yund',     icon:'🐎',  idx:10 },
  { name:'Koyun',   altName:'Koç',      icon:'🐑',  idx:11 },
];

const ANIMAL_ENERGIES = [
  { energy:'çevik ve uyumlu',         gift:'zeka ve yaratıcı çözümler'   }, // 0 Maymun
  { energy:'disiplinli ve güvenilir', gift:'düzen ve dürüstlük'          }, // 1 Horoz
  { energy:'sadık ve koruyucu',       gift:'güvenilirlik ve bağlılık'    }, // 2 Köpek
  { energy:'cömert ve bereketli',     gift:'bolluk ve kararlılık'        }, // 3 Domuz
  { energy:'stratejik ve çevik',      gift:'zeka ve fırsatçılık'         }, // 4 Sıçan
  { energy:'sabırlı ve güçlü',        gift:'kararlılık ve dayanıklılık'  }, // 5 Öküz
  { energy:'cesur ve bağımsız',       gift:'liderlik ve güç'             }, // 6 Kaplan
  { energy:'zarif ve sezgisel',       gift:'barış ve ince anlayış'       }, // 7 Tavşan

function animalIndex(year) {
  return ((year % 12) + 12) % 12;
}

function getElement(year) {
  const name = ELEM_BY_DIGIT[((year % 10) + 10) % 10];
  return { name, ...ELEMENT_DATA[name] };
}

function getSolarYear(date) {
  const m = date.getMonth() + 1, d = date.getDate();
  if (m === 1 || (m === 2 && d < 4)) return date.getFullYear() - 1;
  return date.getFullYear();
}

function getMonthPosition(date) {
  const md = (date.getMonth() + 1) * 100 + date.getDate();
  if (md >= 1207 || md <  105) return 10;
  if (md >= 105  && md <  204) return 11;
  if (md >= 204  && md <  306) return  0;
  if (md >= 306  && md <  405) return  1;
  if (md >= 405  && md <  506) return  2;
  if (md >= 506  && md <  606) return  3;
  if (md >= 606  && md <  707) return  4;
  if (md >= 707  && md <  807) return  5;
  if (md >= 807  && md <  908) return  6;
  if (md >= 908  && md < 1008) return  7;
  if (md >= 1008 && md < 1107) return  8;
  return 9;
}

function getMonthPillar(date, solarYear) {
  const pos       = getMonthPosition(date);
  const yearStem  = ((solarYear % 10) + 10) % 10;
  const tigerStem = ((Math.floor(yearStem / 2) + 4) % 5) * 2;
  const monthStem = (tigerStem + pos) % 10;
  const elemNames = ['Ağaç','Ağaç','Ateş','Ateş','Toprak','Toprak','Metal','Metal','Su','Su'];
  return { animal: MONTH_ANIMALS[pos], element: elemNames[monthStem] };
}

function dateToJD(date) {
  const y = date.getFullYear(), m = date.getMonth() + 1, d = date.getDate();
  const A = Math.floor((14 - m) / 12);
  const Y = y + 4800 - A;
  const M = m + 12 * A - 3;
  return d + Math.floor((153 * M + 2) / 5) + 365 * Y +
         Math.floor(Y / 4) - Math.floor(Y / 100) + Math.floor(Y / 400) - 32045;
}

function getDayPillar(date) {
  const jd      = dateToJD(date);
  const epochJD = dateToJD(new Date(1900, 0, 1));
  const pos     = ((jd - epochJD) % 60 + 60) % 60;
  return { animal: DAY_ANIMALS[pos % 12], element: DAY_ELEMENTS[pos % 10] };
}

function parseLocalDate(str) {
  const [y, m, d] = str.split('-').map(Number);
  return new Date(y, m - 1, d);
}

function animalByName(name) {
  return ANIMALS.find(a => a.name === name) || { icon:'?', name };
}

function getInteraction(a, b) {
  if (a === b) return { type:'same', label:'Aynı Hayvan', icon:'⭕' };
  for (const t of TRINES) {
    if (t.names.includes(a) && t.names.includes(b))
      return { type:'trine', label:`Üçlü Uyum · ${t.label}`, icon:'✨' };
  }
  if (SECRET_FRIENDS[a] === b) return { type:'secret', label:'Gizli Dostluk', icon:'🤝' };
  if (CLASHES[a] === b)        return { type:'clash',  label:'Zıtlık / Gerilim', icon:'⚡' };
  return { type:'neutral', label:'Nötr', icon:'·' };
}

function scoreIx(type) {
  if (type === 'trine')  return 3;
  if (type === 'secret') return 2;
  if (type === 'same')   return 1;
  if (type === 'clash')  return -2;
  return 0;
}

function getLifePhase(age) {
  return LIFE_PHASES.find(p => age >= p.from && age <= p.to)?.name ?? 'Bilgelik';
}

function buildMilestones(birthDateObj, gender) {
  const milestones = gender === 'female' ? FEMALE_MILESTONES : MALE_MILESTONES;
  const solarYear  = getSolarYear(birthDateObj);
  const currentYear = new Date().getFullYear();
  return milestones.map(m => {
    const critYear  = solarYear + m.age;
    const aIdx      = animalIndex(critYear);
    const elem      = getElement(critYear);
    const yearAnim  = ANIMALS[animalIndex(solarYear)].name;
    const ix        = getInteraction(ANIMALS[aIdx].name, yearAnim);
    return {
      age:      m.age,
      type:     m.type,
      title:    m.title,
      critYear,
      animal:   ANIMALS[aIdx].name,
      element:  elem.name,
      interaction: ix.type,
      isPast:   critYear < currentYear - 1,
      isPresent: Math.abs(critYear - currentYear) <= 1,
    };
  });
}

function calcPhaseSync(birthYear1, birthYear2) {
  const currentYear = new Date().getFullYear();
  const endYear = Math.max(birthYear1, birthYear2) + 85;
  const synced = [];
  let inSync = false, syncStart = null, syncPhase = null, pa1 = 0, pa2 = 0;

  for (let y = currentYear - 5; y <= endYear; y++) {
    const age1 = y - birthYear1;
    const age2 = y - birthYear2;
    if (age1 < 0 || age2 < 0) continue;
    const ph1 = getLifePhase(age1);
    const ph2 = getLifePhase(age2);
    if (ph1 === ph2) {
      if (!inSync) { inSync = true; syncStart = y; syncPhase = ph1; pa1 = age1; pa2 = age2; }
    } else {
      if (inSync) { synced.push({ startYear: syncStart, endYear: y - 1, phase: syncPhase, p1StartAge: pa1, p2StartAge: pa2 }); inSync = false; }
    }
  }
  if (inSync) synced.push({ startYear: syncStart, endYear: endYear, phase: syncPhase, p1StartAge: pa1, p2StartAge: pa2 });
  return synced;
}

function renderDualTimeline(m1, m2, n1, n2) {
  const currentYear = new Date().getFullYear();

  // Collect all milestone years
  const yearSet = new Set([...m1.map(m => m.critYear), ...m2.map(m => m.critYear)]);
  const allYears = [...yearSet].sort((a, b) => a - b);

  if (allYears.length === 0) return;

  // Header
  document.getElementById('dtHeader').innerHTML =
    `<div class="dt-header-left">💚 ${n1}</div>
     <div class="dt-header-mid">yıl</div>
     <div class="dt-header-right">💙 ${n2}</div>`;

  const MIN_GAP_PX = 60; // minimum pixels between event rows
  const PX_PER_YEAR = 44;

  let html = '';
  let prevYear = allYears[0];

  allYears.forEach((year, i) => {
    const gapPx = i === 0 ? 0 : Math.max(MIN_GAP_PX, (year - prevYear) * PX_PER_YEAR);
    const e1 = m1.find(m => m.critYear === year);
    const e2 = m2.find(m => m.critYear === year);
    const dotClass = (e1 && e2) ? 'both' : e1 ? 'p1only' : 'p2only';
    const isPast1 = e1?.isPast ?? false;
    const isPast2 = e2?.isPast ?? false;

    const typeColor = t => ({
      norolojik:'#5bb8e8', kozmolojik:'#e87050', kesisim:'#e8c36a', biyolojik:'#6dbf6d'
    }[t] || '#6dbf6d');

    const eventCard = (e, side) => {
      if (!e) return '<div></div>';
      const isPast = e.isPast;
      const anim = animalByName(e.animal);
      return `<div class="dt-event ${side} ${e.type}" style="opacity:${isPast ? 0.5 : 1};border-left-color:${typeColor(e.type)}">
        <div class="de-age">${e.age} yaş${isPast ? ' · geçmiş' : e.isPresent ? ' · şimdi' : ''}</div>
        <div class="de-title">${e.title}</div>
        <div class="de-anim">${anim.icon} ${e.element} ${e.animal}</div>
      </div>`;
    };

    html += `<div class="dt-row" style="margin-top:${gapPx}px">
      <div class="dt-left">${eventCard(e1, 'p1')}</div>
      <div class="dt-mid">
        <div class="dt-dot ${dotClass}"></div>
        <div class="dt-year">${year}</div>
      </div>
      <div class="dt-right">${eventCard(e2, 'p2')}</div>
    </div>`;

    prevYear = year;
  });

  const body = document.getElementById('dtBody');
  body.innerHTML = '<div class="dt-vline"></div>' + html;
}

function calcCouple() {
  const val1 = document.getElementById('date1').value;
  const val2 = document.getElementById('date2').value;
  if (!val1 || !val2) { alert('Lütfen her iki kişinin doğum tarihini girin.'); return; }

  const d1 = parseLocalDate(val1);
  const d2 = parseLocalDate(val2);
  const now = new Date();
  if (d1 > now || d2 > now || d1.getFullYear() < 1900 || d2.getFullYear() < 1900) {
    alert('Lütfen geçerli doğum tarihleri girin (1900 – bugün).');
    return;
  }

  const n1 = document.getElementById('name1').value.trim() || 'Birinci Kişi';
  const n2 = document.getElementById('name2').value.trim() || 'İkinci Kişi';

  const sy1 = getSolarYear(d1);
  const sy2 = getSolarYear(d2);

  const p1 = {
    name: n1, gender: g1, birthDate: val1,
    birthYear: sy1,
    yearPillar:  { animal: ANIMALS[animalIndex(sy1)].name, element: getElement(sy1).name },
    monthPillar: getMonthPillar(d1, sy1),
    dayPillar:   getDayPillar(d1),
    currentAge:  Math.floor((now - d1) / (365.25 * 24 * 3600 * 1000)),
  };

  const p2 = {
    name: n2, gender: g2, birthDate: val2,
    birthYear: sy2,
    yearPillar:  { animal: ANIMALS[animalIndex(sy2)].name, element: getElement(sy2).name },
    monthPillar: getMonthPillar(d2, sy2),
    dayPillar:   getDayPillar(d2),
    currentAge:  Math.floor((now - d2) / (365.25 * 24 * 3600 * 1000)),
  };

  // Cross-interaction matrix (9 pairs)
  const pillars1 = [
    { label:'Vitrin',    anim: p1.yearPillar.animal  },
    { label:'İç Dünya', anim: p1.monthPillar.animal },
    { label:'Öz Kimlik',anim: p1.dayPillar.animal   },
  ];
  const pillars2 = [
    { label:'Vitrin',    anim: p2.yearPillar.animal  },
    { label:'İç Dünya', anim: p2.monthPillar.animal },
    { label:'Öz Kimlik',anim: p2.dayPillar.animal   },
  ];

  let compatScore = 0;
  const crossInteractions = [];
  for (const a of pillars1) {
    for (const b of pillars2) {
      const ix = getInteraction(a.anim, b.anim);
      compatScore += scoreIx(ix.type);
      crossInteractions.push({ labelA: a.label, labelB: b.label, animalA: a.anim, animalB: b.anim, ...ix });
    }
  }

  // Milestones
  const m1 = buildMilestones(d1, g1);
  const m2 = buildMilestones(d2, g2);

  // Phase sync
  const phaseSyncPeriods = calcPhaseSync(sy1, sy2);

  // Store for AI
  _aiData = { partner1: { ...p1, milestones: m1 }, partner2: { ...p2, milestones: m2 }, crossInteractions, compatScore, phaseSyncPeriods, currentYear: now.getFullYear() };

  // ── Render ──
  document.getElementById('compatScoreCard').innerHTML = renderScoreCard(compatScore, n1, n2);

  document.getElementById('couplebirthGrid').innerHTML =
    renderPartnerBirthCard(n1, p1, 'p1') +
    renderMatrix(p1, p2) +
    renderPartnerBirthCard(n2, p2, 'p2');

  // Phase sync list
  const psl = document.getElementById('phaseSyncList');
  if (phaseSyncPeriods.length === 0) {
    psl.innerHTML = '<div style="color:#5a4020;font-size:0.82rem;text-align:center;padding:0.8rem">Aynı anda aynı yaşam evresinde olduğunuz uzun bir dönem hesaplanamadı.</div>';
  } else {
    psl.innerHTML = phaseSyncPeriods.map(p =>
      `<div class="ps-item">
        <div class="ps-icon">${phaseIcon(p.phase)}</div>
        <div>
          <div style="display:flex;gap:0.6rem;align-items:center">
            <div class="ps-years">${p.startYear}–${p.endYear}</div>
            <div class="ps-phase">${p.phase} Evresi</div>
          </div>
          <div class="ps-ages">${n1} ${p.p1StartAge} yaş · ${n2} ${p.p2StartAge} yaş ile başlar</div>
        </div>
      </div>`
    ).join('');
  }

  renderDualTimeline(m1, m2, n1, n2);

  // Reset AI
  const btn = document.getElementById('btnAI');
  btn.disabled = false;
  btn.textContent = '🔮 Kişiselleştirilmiş Uyum Yorumu Al';
  document.getElementById('aiResult').classList.remove('visible');
  document.getElementById('aiResult').innerHTML = '';

  const result = document.getElementById('coupleResult');
  result.classList.add('visible');
  result.scrollIntoView({ behavior:'smooth', block:'start' });
}
